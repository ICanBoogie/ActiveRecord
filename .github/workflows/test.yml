name: test

on:
- push
- pull_request

jobs:
  phpunit:
    name: "phpunit (SQLite, PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - php-version: "8.4"
          dependencies: lowest
        - php-version: "8.5"
          dependencies: highest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        coverage: xdebug
        php-version: "${{ matrix.php-version }}"
        ini-values: memory_limit=-1
        tools: composer:v2
        extensions: pdo_mysql, pdo_pgsql
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.composer/cache
          vendor
        key: "php-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}"
        restore-keys: "php-${{ matrix.php-version }}-${{ matrix.dependencies }}-"

    - name: Install dependencies
      run: composer update --no-interaction --no-progress --prefer-stable ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

    - name: Run PHPUnit
      run: make test-coveralls

    - name: Upload code coverage
      if: ${{ matrix.dependencies == 'highest' }}
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        composer global require php-coveralls/php-coveralls
        php-coveralls --coverage_clover=build/logs/clover.xml -v

  phpunit-db:
    name: "phpunit (${{ matrix.engine }})"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: activerecord
        ports:
        - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        include:
        - engine: mysql
          dsn: 'mysql:host=127.0.0.1;dbname=activerecord'
          username: root
          password: root
        - engine: pgsql
          dsn: 'pgsql:host=127.0.0.1;dbname=postgres'
          username: postgres
          password: postgres
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        coverage: none
        php-version: "8.5"
        ini-values: memory_limit=-1
        tools: composer:v2
        extensions: pdo_mysql, pdo_pgsql
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.composer/cache
          vendor
        key: "php-8.5-highest-${{ hashFiles('composer.json') }}"
        restore-keys: "php-8.5-highest-"

    - name: Install dependencies
      run: composer update --no-interaction --no-progress --prefer-stable

    - name: Run PHPUnit
      env:
        ACTIVERECORD_DSN: "${{ matrix.dsn }}"
        ACTIVERECORD_USERNAME: "${{ matrix.username }}"
        ACTIVERECORD_PASSWORD: "${{ matrix.password }}"
      run: vendor/bin/phpunit --group db
